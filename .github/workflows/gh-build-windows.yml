name: build-windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >
            git
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-cairo
            mingw-w64-x86_64-cairomm
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-flac
            mingw-w64-x86_64-fontconfig
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-fribidi
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-glibmm
            mingw-w64-x86_64-harfbuzz
            mingw-w64-x86_64-libarchive
            mingw-w64-x86_64-liblo
            mingw-w64-x86_64-libogg
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-libsamplerate
            mingw-w64-x86_64-libsigc++
            mingw-w64-x86_64-libsndfile
            mingw-w64-x86_64-libvorbis
            mingw-w64-x86_64-libwebsockets
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-libxslt
            mingw-w64-x86_64-lilv
            mingw-w64-x86_64-lv2
            mingw-w64-x86_64-opus
            mingw-w64-x86_64-pango
            mingw-w64-x86_64-pangomm
            mingw-w64-x86_64-pixman
            mingw-w64-x86_64-rubberband
            mingw-w64-x86_64-serd
            mingw-w64-x86_64-sord
            mingw-w64-x86_64-sratom
            mingw-w64-x86_64-taglib
            mingw-w64-x86_64-vamp-plugin-sdk
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-nsis
            autoconf
            automake
            libtool
            cmake
            bison
            flex
            pkgconf
            python

      - name: Configure
        run: |
          ./waf configure --dist-target=mingw

      - name: Build
        run: |
          ./waf build

      - name: Package Windows installer
        run: |
          cd tools/x-win
          chmod +x package.sh
          ./package.sh

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ardour-windows
          path: /var/tmp/*.exe
