name: Build Ardour (Native Windows MinGW – Nightly Style)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-win-native:
    runs-on: windows-latest

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G

    steps:
      # -----------------------------
      # Checkout
      # -----------------------------
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------
      # Setup MSYS2 + dependencies
      # -----------------------------
      - name: Setup MSYS2 & Install Dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          cache: true
          install: >-
            git make pkg-config diffutils zip
            mingw-w64-x86_64-python
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-autotools
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-libtool
            mingw-w64-x86_64-itstool
            mingw-w64-x86_64-gettext
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-cppunit
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-glibmm
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-gtkmm3
            mingw-w64-x86_64-cairomm
            mingw-w64-x86_64-pangomm
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-libxslt
            mingw-w64-x86_64-libarchive
            mingw-w64-x86_64-libsndfile
            mingw-w64-x86_64-libsamplerate
            mingw-w64-x86_64-taglib
            mingw-w64-x86_64-vamp-plugin-sdk
            mingw-w64-x86_64-rubberband
            mingw-w64-x86_64-aubio
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-liblo
            mingw-w64-x86_64-libwebsockets
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-jack2
            mingw-w64-x86_64-portaudio
            mingw-w64-x86_64-lilv
            mingw-w64-x86_64-serd
            mingw-w64-x86_64-sord
            mingw-w64-x86_64-sratom
            mingw-w64-x86_64-suil
            mingw-w64-x86_64-flac
            mingw-w64-x86_64-libvorbis
            mingw-w64-x86_64-libogg
            mingw-w64-x86_64-readline
            mingw-w64-x86_64-libgnurx
            mingw-w64-x86_64-ccache

      # -----------------------------
      # Restore ccache
      # -----------------------------
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-win-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-win-${{ github.ref }}-
            ccache-win-

      # -----------------------------
      # Prepare ccache (MANDATORY)
      # -----------------------------
      - name: Prepare ccache
        shell: msys2 {0}
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/.ccache"
          ccache -M 2G
          ccache -z

      # -----------------------------
      # Bruteforce GCC discovery
      # -----------------------------
      - name: Bruteforce Find GCC
        shell: msys2 {0}
        run: |
          set -e
          FOUND_GCC=$(find /mingw64 -name "gcc.exe" | head -n 1)
          FOUND_GXX=$(find /mingw64 -name "g++.exe" | head -n 1)
          echo "REAL_GCC=$FOUND_GCC" >> $GITHUB_ENV
          echo "REAL_GXX=$FOUND_GXX" >> $GITHUB_ENV

      # -----------------------------
      # Configure Ardour (ccache FIXED)
      # -----------------------------
      - name: Configure Ardour
        shell: msys2 {0}
        run: |
          set -e

          # Force ccache even with absolute compiler paths
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          export CCACHE_BASEDIR="$GITHUB_WORKSPACE"
          export CCACHE_COMPRESS=1
          export CCACHE_PREFIX=ccache

          export LDFLAGS="-lfftw3f -lfftw3f_threads -lserd-0 -lsord-0 -lsratom-0"
          export CXXFLAGS="-Wno-maybe-uninitialized"

          /mingw64/bin/python ./waf configure \
            --dist-target=mingw \
            --optimize \
            --ptformat \
            --no-dr-mingw \
            --cxx17 \
            --no-lrdf \
            --keepflags \
            --check-c-compiler=gcc \
            --check-cxx-compiler=g++ \
            --with-backends=jack,portaudio,dummy \
            --prefix=$GITHUB_WORKSPACE/_install

      # -----------------------------
      # Build (same ccache env)
      # -----------------------------
      - name: Build Ardour
        shell: msys2 {0}
        run: |
          set -e
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          export CCACHE_BASEDIR="$GITHUB_WORKSPACE"
          export CCACHE_COMPRESS=1
          export CCACHE_PREFIX=ccache
          /mingw64/bin/python ./waf

      # -----------------------------
      # Package (official Ardour script)
      # -----------------------------
      - name: Package using official Ardour script
        shell: msys2 {0}
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          export MSYSTEM=MINGW64
          export PREFIX="$GITHUB_WORKSPACE/_install"
          bash tools/x-win/package.sh

      # -----------------------------
      # Upload packaged result
      # -----------------------------
      - name: Upload Windows Package
        uses: actions/upload-artifact@v4
        with:
          name: Ardour-Windows-Nightly-Style
          path: |
            ardour-*-w64*

      # -----------------------------
      # Show ccache stats (proof)
      # -----------------------------
      - name: ccache stats
        if: always()
        shell: msys2 {0}
        run: |
          ccache -s

      # -----------------------------
      # Always save ccache (even on failure)
      # -----------------------------
      - name: Save ccache (always)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-win-${{ github.ref }}-${{ github.sha }}
