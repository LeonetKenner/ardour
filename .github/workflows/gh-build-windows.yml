name: Build Ardour (Native Windows MinGW – Nightly)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-win-native:
    runs-on: windows-latest

    env:
      MSYSTEM: MINGW64
      MSYS2_PATH_TYPE: inherit

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSYS2 & Install Dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          cache: true
          install: >-
            git make pkg-config diffutils zip unzip
            mingw-w64-x86_64-python
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-autotools
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-nsis
            mingw-w64-x86_64-libtool
            mingw-w64-x86_64-itstool
            mingw-w64-x86_64-gettext
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-cppunit
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-glibmm
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-gtkmm3
            mingw-w64-x86_64-cairomm
            mingw-w64-x86_64-pangomm
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-libxslt
            mingw-w64-x86_64-libarchive
            mingw-w64-x86_64-libsndfile
            mingw-w64-x86_64-libsamplerate
            mingw-w64-x86_64-taglib
            mingw-w64-x86_64-vamp-plugin-sdk
            mingw-w64-x86_64-rubberband
            mingw-w64-x86_64-aubio
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-liblo
            mingw-w64-x86_64-libwebsockets
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-jack2
            mingw-w64-x86_64-portaudio
            mingw-w64-x86_64-lilv
            mingw-w64-x86_64-serd
            mingw-w64-x86_64-sord
            mingw-w64-x86_64-sratom
            mingw-w64-x86_64-suil
            mingw-w64-x86_64-flac
            mingw-w64-x86_64-libvorbis
            mingw-w64-x86_64-libogg
            mingw-w64-x86_64-readline
            mingw-w64-x86_64-libgnurx

      - name: Verify Architecture (x86_64)
        shell: msys2 {0}
        run: |
          echo "Checking compiler architecture..."
          gcc -v
          if [[ $(gcc -dumpmachine) != *"x86_64"* ]]; then
            echo "ERROR: Compiler is NOT x86_64!"
            exit 1
          fi

      - name: Clean waf cache
        shell: msys2 {0}
        run: |
          rm -rf .waf-*

      - name: Configure Ardour
        shell: msys2 {0}
        run: |
          set -e

          export CFLAGS="-mstackrealign"
          export CXXFLAGS="-mstackrealign -Wno-maybe-uninitialized"
          export LDFLAGS="-luuid -lole32 -lfftw3f -lfftw3f_threads -lserd-0 -lsord-0 -lsratom-0"

          /mingw64/bin/python ./waf configure \
            --dist-target=mingw \
            --optimize \
            --ptformat \
            --no-dr-mingw \
            --cxx17 \
            --check-c-compiler=gcc \
            --check-cxx-compiler=g++ \
            --no-lrdf \
            --arch="-mstackrealign" \
            --with-backends=jack,portaudio,dummy \
            --prefix="$GITHUB_WORKSPACE/_install"

      - name: Build
        shell: msys2 {0}
        run: |
          /mingw64/bin/python ./waf

      - name: Install to Prefix
        shell: msys2 {0}
        run: |
          /mingw64/bin/python ./waf install

      - name: Package
        shell: msys2 {0}
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          export PREFIX="$GITHUB_WORKSPACE/_install"
          bash tools/x-win/package.sh

      - name: Upload Windows Package
        uses: actions/upload-artifact@v4
        with:
          name: Ardour-Windows-Nightly
          path: |
            Ardour-*-win*.exe
            ardour-*-w64*
