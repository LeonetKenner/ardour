name: Cross-Compile Ardour (Arch/MinGW)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-arch-mingw:
    runs-on: ubuntu-latest
    container: archlinux:base-devel

    env:
      CC: x86_64-w64-mingw32-gcc
      CXX: x86_64-w64-mingw32-g++
      WINDRES: x86_64-w64-mingw32-windres
      PKG_CONFIG_LIBDIR: /usr/x86_64-w64-mingw32/lib/pkgconfig:/usr/x86_64-w64-mingw32/share/pkgconfig

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Martchus Repo & Keys
        run: |
          # 1. Initialize Pacman Keys
          pacman-key --init
          pacman-key --populate archlinux
          
          # 2. Receive and Sign the Martchus Key (B9E3...)
          # We use keyserver.ubuntu.com as it is generally reliable in CI environments
          pacman-key --keyserver keyserver.ubuntu.com --recv-keys B9E36A7275FC61B464B67907E06FE8F53CDC6A4C
          pacman-key --lsign-key B9E36A7275FC61B464B67907E06FE8F53CDC6A4C
          
          # 3. Add [ownstuff] repo to pacman.conf
          # Using the mirror list you provided
          echo "" >> /etc/pacman.conf
          echo "[ownstuff]" >> /etc/pacman.conf
          echo "Server = https://ftp.f3l.de/~martchus/\$repo/os/\$arch" >> /etc/pacman.conf
          echo "Server = https://martchus.dyn.f3l.de/repo/arch/\$repo/os/\$arch" >> /etc/pacman.conf
          
          # 4. Update and Install Dependencies
          # We run -Syu to ensure base packages are synced with the new repo enabled
          pacman -Syu --noconfirm \
            git python make diffutils \
            mingw-w64-gcc mingw-w64-pkg-config \
            mingw-w64-boost \
            mingw-w64-glib2 mingw-w64-glibmm \
            mingw-w64-gtk3 mingw-w64-gtkmm3 \
            mingw-w64-cairomm mingw-w64-pangomm \
            mingw-w64-libsndfile mingw-w64-libarchive \
            mingw-w64-curl mingw-w64-liblo \
            mingw-w64-taglib mingw-w64-fftw \
            mingw-w64-libxml2 mingw-w64-libsamplerate \
            mingw-w64-jack2 \
            mingw-w64-lilv mingw-w64-serd mingw-w64-sord mingw-w64-sratom \
            mingw-w64-portaudio

      - name: Configure for MinGW
        run: |
          python ./waf configure \
            --dist-target=mingw \
            --optimize \
            --ptformat \
            --no-dr-mingw \
            --cxx17 \
            --with-backends=jack,portaudio,dummy \
            --prefix=/output

      - name: Build Ardour
        run: |
          ./waf

      - name: Install to Staging
        run: |
          ./waf install --destdir=$GITHUB_WORKSPACE/_install

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ardour-arch-mingw64
          path: _install
