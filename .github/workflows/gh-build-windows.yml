name: Build Ardour (Native Windows MinGW – Portable)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-win-native:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------
      # Setup MSYS2 (with internal cache)
      # -----------------------------
      - name: Setup MSYS2 & Install Dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          cache: true
          install: >-
            git make pkg-config diffutils
            mingw-w64-x86_64-python
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-autotools
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-libtool
            mingw-w64-x86_64-itstool
            mingw-w64-x86_64-gettext
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-cppunit
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-glibmm
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-gtkmm3
            mingw-w64-x86_64-cairomm
            mingw-w64-x86_64-pangomm
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-libxslt
            mingw-w64-x86_64-libarchive
            mingw-w64-x86_64-libsndfile
            mingw-w64-x86_64-libsamplerate
            mingw-w64-x86_64-taglib
            mingw-w64-x86_64-vamp-plugin-sdk
            mingw-w64-x86_64-rubberband
            mingw-w64-x86_64-aubio
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-liblo
            mingw-w64-x86_64-libwebsockets
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-jack2
            mingw-w64-x86_64-portaudio
            mingw-w64-x86_64-lilv
            mingw-w64-x86_64-serd
            mingw-w64-x86_64-sord
            mingw-w64-x86_64-sratom
            mingw-w64-x86_64-suil
            mingw-w64-x86_64-flac
            mingw-w64-x86_64-libvorbis
            mingw-w64-x86_64-libogg
            mingw-w64-x86_64-readline
            mingw-w64-x86_64-libgnurx

      # -----------------------------
      # Bruteforce GCC discovery
      # -----------------------------
      - name: Bruteforce Find GCC
        shell: msys2 {0}
        run: |
          set -e
          FOUND_GCC=$(find /mingw64 -name "gcc.exe" | head -n 1)
          FOUND_GXX=$(find /mingw64 -name "g++.exe" | head -n 1)
          echo "REAL_GCC=$FOUND_GCC" >> $GITHUB_ENV
          echo "REAL_GXX=$FOUND_GXX" >> $GITHUB_ENV

      # -----------------------------
      # Configure
      # -----------------------------
      - name: Configure Ardour
        shell: msys2 {0}
        run: |
          set -e
          export CC="$REAL_GCC"
          export CXX="$REAL_GXX"
          export LDFLAGS="-lfftw3f -lfftw3f_threads -lserd-0 -lsord-0 -lsratom-0"
          export CXXFLAGS="-Wno-maybe-uninitialized"

          /mingw64/bin/python ./waf configure \
            --dist-target=mingw \
            --optimize \
            --ptformat \
            --no-dr-mingw \
            --cxx17 \
            --no-lrdf \
            --keepflags \
            --with-backends=jack,portaudio,dummy \
            --prefix=$GITHUB_WORKSPACE/_install

      # -----------------------------
      # Build
      # -----------------------------
      - name: Build Ardour
        shell: msys2 {0}
        run: |
          set -e
          export CC="$REAL_GCC"
          export CXX="$REAL_GXX"
          /mingw64/bin/python ./waf

      # -----------------------------
      # Install
      # -----------------------------
      - name: Install Ardour
        shell: msys2 {0}
        run: |
          set -e
          /mingw64/bin/python ./waf install

      # -----------------------------
      # Bundle required DLLs
      # -----------------------------
      - name: Bundle MinGW runtime DLLs
        shell: msys2 {0}
        run: |
          set -e
          BIN="$GITHUB_WORKSPACE/_install/bin"
          MINGW="/mingw64/bin"

          ldd "$BIN/ardour.exe" \
            | grep mingw64 \
            | awk '{print $3}' \
            | while read dll; do
                cp -u "$dll" "$BIN/"
              done

          cp -u "$MINGW"/libgcc_s_seh-1.dll "$BIN/" || true
          cp -u "$MINGW"/libstdc++-6.dll "$BIN/" || true
          cp -u "$MINGW"/libwinpthread-1.dll "$BIN/" || true

      # -----------------------------
      # Strip binaries
      # -----------------------------
      - name: Strip binaries
        shell: msys2 {0}
        run: |
          strip _install/bin/*.exe || true
          strip _install/bin/*.dll || true

      # -----------------------------
      # Create portable layout
      # -----------------------------
      - name: Create portable layout
        shell: msys2 {0}
        run: |
          set -e
          PORTABLE="$GITHUB_WORKSPACE/Ardour-Portable"
          INSTALL="$GITHUB_WORKSPACE/_install"

          rm -rf "$PORTABLE"
          mkdir -p "$PORTABLE"

          mv "$INSTALL/bin/"* "$PORTABLE/"
          mv "$INSTALL/lib" "$PORTABLE/"
          mv "$INSTALL/share" "$PORTABLE/"

          if [ -d "$INSTALL/etc" ]; then
            mv "$INSTALL/etc" "$PORTABLE/"
          fi

          rm -rf "$INSTALL"

      # -----------------------------
      # Upload artifact
      # -----------------------------
      - name: Upload Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ardour-Portable-Windows-x86_64
          path: Ardour-Portable
