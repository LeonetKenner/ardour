name: Build Ardour (Native Windows MinGW)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-win-native:
    runs-on: windows-latest
    
    env:
      MSYS2_CACHE_DIR: D:\a\_temp\msys64\var\cache\pacman\pkg
      CCACHE_DIR: D:\a\_temp\.ccache

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache MSYS2 Packages
        uses: actions/cache@v4
        with:
          path: ${{ env.MSYS2_CACHE_DIR }}
          key: msys2-packages-${{ runner.os }}-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: msys2-packages-${{ runner.os }}-

      - name: Cache CCache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Setup MSYS2 & Install Deps
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make pkg-config diffutils ccache
            mingw-w64-x86_64-python
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-autotools
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-libtool
            mingw-w64-x86_64-itstool
            mingw-w64-x86_64-gettext
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-cppunit
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-glibmm
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-gtkmm3
            mingw-w64-x86_64-cairomm
            mingw-w64-x86_64-pangomm
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-libxslt
            mingw-w64-x86_64-libarchive
            mingw-w64-x86_64-libsndfile
            mingw-w64-x86_64-libsamplerate
            mingw-w64-x86_64-taglib
            mingw-w64-x86_64-vamp-plugin-sdk
            mingw-w64-x86_64-rubberband
            mingw-w64-x86_64-aubio
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-liblo
            mingw-w64-x86_64-libwebsockets
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-jack2
            mingw-w64-x86_64-portaudio
            mingw-w64-x86_64-lilv
            mingw-w64-x86_64-serd
            mingw-w64-x86_64-sord
            mingw-w64-x86_64-sratom
            mingw-w64-x86_64-suil
            mingw-w64-x86_64-flac
            mingw-w64-x86_64-libvorbis
            mingw-w64-x86_64-libogg
            mingw-w64-x86_64-readline
            mingw-w64-x86_64-libgnurx

      - name: Bruteforce Find GCC
        shell: msys2 {0}
        run: |
          FOUND_GCC=$(find /mingw64 -name "gcc.exe" | head -n 1)
          FOUND_GXX=$(find /mingw64 -name "g++.exe" | head -n 1)
          echo "REAL_GCC=$FOUND_GCC" >> $GITHUB_ENV
          echo "REAL_GXX=$FOUND_GXX" >> $GITHUB_ENV

      - name: Configure
        shell: msys2 {0}
        run: |
          # 1. WRAP COMPILER WITH CCACHE
          # Instead of passing --ccache, we prepend it to the compiler command.
          export CC="ccache $REAL_GCC"
          export CXX="ccache $REAL_GXX"
          
          # 2. CRITICAL LINK FLAGS (Fixes missing symbols)
          export LINKFLAGS="-lfftw3f -lserd-0 -lsord-0 -lsratom-0"
          
          # 3. Configure
          # Added --no-lrdf because we removed the Redland/Raptor libraries
          /mingw64/bin/python ./waf configure \
            --dist-target=mingw \
            --optimize \
            --ptformat \
            --no-dr-mingw \
            --cxx17 \
            --no-lrdf \
            --with-backends=jack,portaudio,dummy \
            --check-c-compiler=gcc \
            --check-cxx-compiler=g++ \
            --prefix=$GITHUB_WORKSPACE/_install

      - name: Build
        shell: msys2 {0}
        run: |
          /mingw64/bin/python ./waf

      - name: Install
        shell: msys2 {0}
        run: |
          /mingw64/bin/python ./waf install

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ardour-win-x86_64
          path: _install
