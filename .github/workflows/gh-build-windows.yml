name: Build Ardour (MinGW Native)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-mingw-native:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSYS2 (Like apt for MinGW)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          # These are the pre-built binaries (the "PPA" equivalent)
          install: >-
            git make python3 diffutils
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-glibmm
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-gtkmm3
            mingw-w64-x86_64-cairomm
            mingw-w64-x86_64-pangomm
            mingw-w64-x86_64-libsndfile
            mingw-w64-x86_64-libarchive
            mingw-w64-x86_64-liblo
            mingw-w64-x86_64-taglib
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-libsamplerate
            mingw-w64-x86_64-jack2
            mingw-w64-x86_64-lilv
            mingw-w64-x86_64-serd
            mingw-w64-x86_64-sord
            mingw-w64-x86_64-sratom
            mingw-w64-x86_64-portaudio

      - name: Configure Build
        shell: msys2 {0}
        run: |
          # We are running natively on Windows now.
          # --dist-target=mingw sets up the windows-specific flags automatically.
          
          python ./waf configure \
            --dist-target=mingw \
            --optimize \
            --ptformat \
            --no-dr-mingw \
            --cxx17 \
            --with-backends=jack,portaudio,dummy \
            --prefix=$GITHUB_WORKSPACE/_install

      - name: Build Ardour
        shell: msys2 {0}
        run: |
          python ./waf

      - name: Install
        shell: msys2 {0}
        run: |
          python ./waf install

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ardour-win-x86_64
          path: _install
